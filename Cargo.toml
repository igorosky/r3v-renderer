[package]
name = "r3v-renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
cgmath = "0.18.0"
futures-channel = "0.3.34"
image = { version = "0.25.10", optional = true }
js-sys = { version = "0.3.106", optional = true }
pollster = "1.0.1"
pyo3 = { version = "0.29.3", features = ["extension-module"], optional = true }
quick-xml = "0.39.4"
rayon = { version = "1.12.0", optional = true }
rustc-hash = "2.1.3"
softbuffer = { version = "0.4", optional = true }
stl_io = { version = "0.11.0" }
urdf-rs = { version = "0.10.0" }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
wgpu = "30.0.1"
winit = { version = "0.30", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[build-dependencies]
cbindgen = { version = "0.29.4", optional = true }
pyo3-build-config = { version = "0.29.3", optional = true }

[features]
c = ["dep:cbindgen"]
cpp = ["dep:cbindgen"]
demo = ["dep:image", "dep:winit", "dep:softbuffer", "multi-threaded"]
js = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
multi-threaded = ["dep:rayon"]
python = ["dep:pyo3", "dep:pyo3-build-config"]

[[bin]]
name = "r3v-renderer"
path = "src/main.rs"
required-features = ["demo"]

[[test]]
name = "c_bindings"
harness = false
required-features = ["c"]

[[test]]
name = "cpp_bindings"
harness = false
required-features = ["cpp"]

[[test]]
name = "python_bindings"
harness = false
required-features = ["python"]

[[test]]
name = "js_bindings"
harness = false
required-features = ["js"]
